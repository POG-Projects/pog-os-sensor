name: CI & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing semantic-version tag to publish
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  prepare:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate declared version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION=$(tr -d '[:space:]' < version.txt)
          printf '%s\n' "$VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "v$VERSION" = "$RELEASE_TAG"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  host-tests:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Compile and run host tests
        run: |
          python3 test_host/test_release_workflow.py
          for source in test_host/*.cpp; do
            binary="/tmp/$(basename "${source%.cpp}")"
            c++ -std=c++17 -Wall -Wextra -Werror -I include \
              "$source" -o "$binary"
            "$binary"
          done
      - name: Validate embedded dashboard JavaScript
        run: |
          awk '/<script>/{flag=1;next}/<\/script>/{flag=0}flag' \
            src/web_ui.h > /tmp/pog-sensor-dashboard.js
          node --check /tmp/pog-sensor-dashboard.js

  build:
    if: github.event_name != 'workflow_dispatch'
    needs: [prepare, host-tests]
    runs-on: ubuntu-latest
    env:
      POGSENSOR_BUILD_VERSION: ${{ needs.prepare.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: esp32c3
            env: esp32c3
          - name: esp32s3
            env: esp32s3
          - name: esp32dev
            env: esp32dev
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-
      - name: Install PlatformIO
        run: pip install platformio==6.1.19
      - name: Build and verify ${{ matrix.name }}
        run: |
          pio run -e "${{ matrix.env }}"
          FIRMWARE=".pio/build/${{ matrix.env }}/firmware.bin"
          python3 - "$FIRMWARE" <<'PY'
          import os
          import sys

          version = os.environ["POGSENSOR_BUILD_VERSION"]
          marker = f"POGSensor/{version}".encode()
          if marker not in open(sys.argv[1], "rb").read():
              raise SystemExit(f"{sys.argv[1]}: missing embedded version {version}")
          PY

  dispatch-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag source and dispatch trusted publication
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          printf '%s\n' "$VERSION" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          test "v$(tr -d '[:space:]' < version.txt)" = "$VERSION"
          TAG_COMMIT=$(git rev-parse "${VERSION}^{commit}")
          test "$TAG_COMMIT" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$TAG_COMMIT" origin/main
          ! gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          gh workflow run ci-release.yml --repo "$GITHUB_REPOSITORY" \
            --ref main -f "release_tag=$VERSION"

  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on:
      group: POG Release trusted
      labels: pog-release-linux-x64
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate immutable release source
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          printf '%s\n' "$VERSION" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          test "v$(tr -d '[:space:]' < version.txt)" = "$VERSION"
          TAG_COMMIT=$(git rev-parse "${VERSION}^{commit}")
          test "$TAG_COMMIT" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$TAG_COMMIT" origin/main
          ! gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          echo "SOURCE_COMMIT=$TAG_COMMIT" >> "$GITHUB_ENV"
          echo "POGSENSOR_BUILD_VERSION=${VERSION#v}" >> "$GITHUB_ENV"
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: release-pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: release-pio-${{ runner.os }}-
      - name: Install pinned PlatformIO
        run: pip install platformio==6.1.19
      - name: Rebuild every release image from the tag
        run: |
          set -euo pipefail
          mkdir -p dist
          while IFS='|' read -r NAME ENV CHIP FLASH LABEL; do
            pio run -e "$ENV"
            APP="dist/firmware-$NAME.bin"
            MERGED="dist/merged-$NAME.bin"
            cp ".pio/build/$ENV/firmware.bin" "$APP"
            cp ".pio/build/$ENV/firmware.factory.bin" "$MERGED"
            python3 - "$APP" <<'PY'
          import os
          import sys

          version = os.environ["POGSENSOR_BUILD_VERSION"]
          if f"POGSensor/{version}".encode() not in open(sys.argv[1], "rb").read():
              raise SystemExit(f"{sys.argv[1]}: missing embedded version {version}")
          PY
            APP_SHA=$(sha256sum "$APP" | cut -d' ' -f1)
            MERGED_SHA=$(sha256sum "$MERGED" | cut -d' ' -f1)
            MERGED_SIZE=$(stat -c%s "$MERGED")
            python3 - "$NAME" "$ENV" "$CHIP" "$FLASH" "$LABEL" \
              "$APP_SHA" "$MERGED_SHA" "$MERGED_SIZE" <<'PY'
          import json
          import sys

          name, env, chip, flash, label, app_sha, merged_sha, merged_size = sys.argv[1:]
          fragment = {
              "env": env,
              "label": label,
              "chip": chip,
              "flashSize": flash,
              "app": f"firmware-{name}.bin",
              "appSha256": app_sha,
              "merged": f"merged-{name}.bin",
              "mergedSha256": merged_sha,
              "mergedSize": int(merged_size),
          }
          with open(f"dist/manifest-{name}.json", "w", encoding="utf-8") as stream:
              json.dump(fragment, stream, ensure_ascii=False, indent=2)
          PY
          done <<'BOARDS'
          esp32c3|esp32c3|esp32c3|4MB|ESP32-C3 SuperMini (4 Mo)
          esp32s3|esp32s3|esp32s3|8MB|ESP32-S3 DevKitC-1 (8 Mo)
          esp32dev|esp32dev|esp32|4MB|ESP32 DevKit (4 Mo)
          BOARDS
      - name: Assemble and verify release
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          boards = [json.loads(path.read_text()) for path in sorted(Path("dist").glob("manifest-*.json"))]
          if len(boards) != 3:
              raise SystemExit(f"expected 3 boards, found {len(boards)}")
          for board in boards:
              for asset_key, hash_key in (("app", "appSha256"), ("merged", "mergedSha256")):
                  path = Path("dist", board[asset_key])
                  if hashlib.sha256(path.read_bytes()).hexdigest() != board[hash_key]:
                      raise SystemExit(f"{path}: digest mismatch")
              if Path("dist", board["merged"]).stat().st_size != board["mergedSize"]:
                  raise SystemExit(f"{board['env']}: merged size mismatch")
          manifest = {"version": os.environ["POGSENSOR_BUILD_VERSION"], "boards": boards}
          Path("dist/manifest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n")
          for path in Path("dist").glob("manifest-*.json"):
              path.unlink()
          PY
          (cd dist && sha256sum *.bin manifest.json > SHA256SUMS)
          cat dist/manifest.json
          cat dist/SHA256SUMS
      - name: Publish one immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          ! gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          gh release create "$VERSION" dist/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "POG OS Sensor $VERSION" --generate-notes
